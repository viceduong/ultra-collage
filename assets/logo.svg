<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#0f0f1a"/>

  <!-- Collage grid shapes — overlapping photos -->
  <!-- Top-left: indigo -->
  <rect x="56" y="56" width="200" height="190" rx="20" fill="url(#g1)" opacity="0.95"/>
  <!-- Top-right: pink -->
  <rect x="268" y="56" width="188" height="124" rx="20" fill="url(#g2)" opacity="0.9"/>
  <!-- Bottom-left: amber -->
  <rect x="56" y="258" width="124" height="198" rx="20" fill="url(#g3)" opacity="0.9"/>
  <!-- Bottom-right: emerald -->
  <rect x="192" y="192" width="264" height="264" rx="20" fill="url(#g4)" opacity="0.85"/>

  <!-- "UC" monogram centered -->
  <text x="256" y="326" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="160" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-8">UC</text>

  <!-- Subtle white inner ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
