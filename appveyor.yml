version: 1.0.0.{build}

image: macos-monterey

environment:
  TARGET: x86_64-apple-darwin

install:
  - nvm use 22 || nvm install 22
  - npm ci
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  - source $HOME/.cargo/env && rustup target add $TARGET

build_script:
  - source $HOME/.cargo/env
  - npm run tauri build -- --target $TARGET --bundles dmg

after_build:
  - mkdir -p dist
  - cp "src-tauri/target/$TARGET/release/bundle/dmg/"*.dmg dist/

artifacts:
  - path: dist/*.dmg
    name: macOS-Intel

deploy: off
